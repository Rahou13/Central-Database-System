<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | FBI Central Database System</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --accent: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1e293b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .gate-box {
            background-color: var(--card-bg);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 30px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .gate-box h2 { color: #60a5fa; margin: 0 0 5px; }
        .gate-box p { color: var(--text-muted); margin: 0; font-size: 0.9rem; }
        .gate-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0 8px;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }
        .gate-box button {
            width: 100%;
            padding: 10px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        .gate-error {
            color: var(--danger);
            font-size: 0.85rem;
            min-height: 1.2em;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="gate-box">
        <h2>تسجيل الدخول</h2>
        <p>أدخل اسمك للوصول إلى قاعدة البيانات</p>
        <input id="agentName" type="text" maxlength="40" placeholder="الاسم">
        <input id="agentPass" type="password" maxlength="40" placeholder="كلمة السر">
        <p id="gateError" class="gate-error"></p>
        <button onclick="enterSite()">دخول</button>
    </div>

    <script>
        const ALLOWED_USER = 'agent007';
const ALLOWED_PASS = 'secret123';

function enterSite() {
    const name = document.getElementById('agentName').value.trim();
    const pass = document.getElementById('agentPass').value;
    const error = document.getElementById('gateError');

    if (!name || !pass) {
        error.textContent = 'الرجاء كتابة الاسم وكلمة السر';
        return;
    }
    if (name !== ALLOWED_USER || pass !== ALLOWED_PASS) {
        error.textContent = 'الاسم أو كلمة السر غير صحيحة';
        return;
    }

    sessionStorage.setItem('agentName', name);
    window.location.href = 'dashboard.html';
}
    </script>
</body>
</html>
